<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merci pour ton don – NBJA</title>
<meta name="robots" content="noindex">
<style>
  :root{--bleu:#0b2a8a;--bleu-clair:#2f6bff;--or:#e0a526;--fond:#eef3ff;--texte:#0e1b3d}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
    font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--texte);
    background:radial-gradient(1000px 500px at 20% -10%,#cfe0ff 0,transparent 60%),
               radial-gradient(800px 500px at 100% 100%,#ffe9b8 0,transparent 55%),var(--fond)}
  main{max-width:460px;width:100%;text-align:center;padding:36px 28px;border-radius:28px;
    background:rgba(255,255,255,.62);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.9);box-shadow:0 20px 50px rgba(11,42,138,.15)}
  .coeur{font-size:56px;line-height:1}
  h1{margin:14px 0 10px;font-size:28px;color:var(--bleu)}
  p{margin:0 0 12px;line-height:1.55;font-size:17px}
  .devise{font-weight:600;color:var(--bleu)}
  a.bouton{display:inline-block;margin-top:14px;padding:14px 26px;border-radius:999px;
    background:linear-gradient(135deg,var(--bleu-clair),var(--bleu));color:#fff;text-decoration:none;font-weight:600}
  a.bouton:focus-visible{outline:3px solid var(--or);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="coeur" aria-hidden="true">💙</div>
  <h1>Merci pour ton don</h1>
  <p>Grâce à toi, l'association NBJA peut continuer à aider les personnes albinos en RDC.</p>
  <p>Si le paiement est confirmé, tu recevras un message d'Orange Money.</p>
  <p class="devise">Solidarité • Dignité • Inclusion</p>
  <a class="bouton" href="/">Retour au site</a>
</main>
</body>
</html>
